  /api/v1/organizations/branches/{uuid}/:
    get:
      operationId: v1_organizations_branches_retrieve
      description: Retrieve and update a branch.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - CookieJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
    put:
      operationId: v1_organizations_branches_update
      description: Retrieve and update a branch.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BranchUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BranchUpdate'
        required: true
      security:
      - CookieJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchUpdate'
          description: ''
    patch:
      operationId: v1_organizations_branches_partial_update
      description: Retrieve and update a branch.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBranchUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBranchUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBranchUpdate'
      security:
      - CookieJWTAuthentication: []
