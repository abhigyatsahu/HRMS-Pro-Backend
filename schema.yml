  /api/v1/organizations/branches/{uuid}/activate/:
    post:
      operationId: v1_organizations_branches_activate_create
      description: Activate a branch by its UUID.
      summary: Activate Branch
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
