openapi: 3.0.3
info:
  title: HRMS Pro API
  version: 1.0.0
  description: API documentation for the HRMS Pro backend application.
paths:
  /api/auth/csrf/:
    get:
      operationId: csrf_token
      description: Retrieve a new CSRF token to include in the headers of subsequent
        write requests.
      summary: Retrieve CSRF Token
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFTokenResponse'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate a user using credentials. Sets access and refresh
        tokens in secure cookies.
      summary: User Login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Clear access and refresh tokens from HTTP-only cookies and blacklist
        the refresh token.
      summary: Logout User
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Get the authenticated user's profile details.
      summary: Retrieve Current User
      tags:
      - auth
      security:
      - CookieJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Refresh user credentials and cookies using the stored refresh token
        cookie.
      summary: Refresh Session Token
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshSuccessResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshErrorResponse'
          description: ''
  /api/v1/departments/:
    get:
      operationId: v1_departments_list
      description: List and create departments.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - CookieJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepartmentList'
          description: ''
    post:
      operationId: v1_departments_create
      description: List and create departments.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
        required: true
      security:
      - CookieJWTAuthentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentCreate'
          description: ''
  /api/v1/departments/{uuid}/:
    get:
      operationId: v1_departments_retrieve
      description: Retrieve and update a department.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - CookieJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
    put:
      operationId: v1_departments_update
      description: Retrieve and update a department.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
        required: true
      security:
      - CookieJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentUpdate'
          description: ''
    patch:
      operationId: v1_departments_partial_update
      description: Retrieve and update a department.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentUpdate'
      security:
      - CookieJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentUpdate'
          description: ''
  /api/v1/departments/{uuid}/activate/:
    post:
      operationId: v1_departments_activate_create
      description: Activate a department.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Department'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Department'
        required: true
      security:
      - CookieJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
  /api/v1/departments/{uuid}/deactivate/:
    post:
      operationId: v1_departments_deactivate_create
      description: Deactivate a department.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Department'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Department'
        required: true
      security:
      - CookieJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
