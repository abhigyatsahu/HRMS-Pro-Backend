    post:
      operationId: v1_organizations_branches_create
      description: List and create branches.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreate'
          application/x-www-form-urlencoded:
