components:
  schemas:
    Branch:
      type: object
      description: Serializer used for Branch responses.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        organization_uuid:
          type: string
          format: uuid
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 50
        address:
          type: string
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        phone:
          type: string
          maxLength: 20
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - name
      - organization_name
      - organization_uuid
      - updated_at
      - uuid
    BranchActivateSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        message:
          type: string
          default: Branch activated successfully.
        data:
          $ref: '#/components/schemas/Branch'
      required:
      - data
    BranchCreate:
      type: object
      description: Serializer used when creating a Branch.
      properties:
        organization_uuid:
          type: string
          format: uuid
          writeOnly: true
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 50
        address:
          type: string
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        phone:
          type: string
          maxLength: 20
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - code
      - name
      - organization_uuid
    BranchDeactivateSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        message:
          type: string
          default: Branch deactivated successfully.
        data:
          $ref: '#/components/schemas/Branch'
      required:
      - data
    BranchUpdate:
      type: object
      description: Serializer used when updating a Branch.
      properties:
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 50
        address:
          type: string
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        phone:
          type: string
          maxLength: 20
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - code
      - name
    CSRFTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        csrfToken:
          type: string
      required:
      - csrfToken
    CurrentUser:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
      required:
      - email
      - first_name
      - full_name
      - is_staff
      - is_superuser
      - last_name
      - role
      - username
      - uuid
    CurrentUserResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        message:
          type: string
          default: Current user retrieved successfully.
        data:
          $ref: '#/components/schemas/CurrentUser'
      required:
      - data
    Department:
      type: object
      description: Serializer used for Department responses.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        organization_uuid:
          type: string
          format: uuid
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 50
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - name
      - organization_name
      - organization_uuid
      - updated_at
      - uuid
    DepartmentCreate:
      type: object
      description: Serializer used when creating a Department.
      properties:
        organization_uuid:
          type: string
          format: uuid
          writeOnly: true
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 50
        description:
          type: string
      required:
      - code
      - name
      - organization_uuid
    DepartmentUpdate:
      type: object
      description: Serializer used when updating a Department.
      properties:
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 50
        description:
          type: string
      required:
      - code
      - name
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    LoginSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        message:
          type: string
          default: Login successful.
    LogoutResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        message:
          type: string
          default: Logged out successfully.
    Organization:
      type: object
      description: Serializer used for reading Organization data.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 50
        legal_name:
          type: string
          maxLength: 250
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 20
