      security:
      - CookieJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUpdate'
          description: ''
  /api/v1/organizations/{uuid}/activate/:
    post:
      operationId: v1_organizations_activate_create
      description: Activate an organization by its UUID.
      summary: Activate Organization
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - CookieJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationActivateSuccessResponse'
          description: ''
  /api/v1/organizations/{uuid}/deactivate/:
    post:
      operationId: v1_organizations_deactivate_create
